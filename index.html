<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Hole City — a Hole.io-style game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #bfe3ff; color: #1d2340;
    font-family: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  .card { background: rgba(255,255,255,.88); border-radius: 16px; box-shadow: 0 8px 24px rgba(20,30,70,.18); }
  #hud { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    width: 204px; padding: 10px; pointer-events: none; }
  #timer { font-size: 30px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
  #timer.low { color: #e63946; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .board { list-style: none; margin-top: 6px; }
  .board li { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 9px; font-size: 14px; font-weight: 700; }
  .board li.me { background: rgba(58,134,255,.16); }
  .board .rk { width: 14px; font-size: 12px; opacity: .5; }
  .board .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .board .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .sc { font-weight: 900; font-variant-numeric: tabular-nums; }
  .label { position: fixed; left: 0; top: 0; z-index: 2; padding: 2px 9px; border-radius: 10px; color: #fff; font-size: 12px;
    font-weight: 800; white-space: nowrap; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,.25); will-change: transform; }
  .label.me { box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.3); }
  .pop { position: fixed; z-index: 3; pointer-events: none; color: #fff; font-size: 22px; font-weight: 900;
    text-shadow: 0 2px 6px rgba(0,0,0,.55); transform: translate(-50%,-50%); animation: rise .9s ease-out forwards; }
  @keyframes rise { to { transform: translate(-50%,-170%); opacity: 0; } }
  #toast { position: fixed; z-index: 6; left: 50%; top: calc(14% + env(safe-area-inset-top, 0px)); padding: 10px 18px; font-weight: 800;
    white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-50%,-8px); transition: opacity .25s, transform .25s; }
  #toast.show { opacity: 1; transform: translate(-50%,0); }
  #toast.bad { color: #d62839; }
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(18,26,56,.4); }
  #overlay.hidden { display: none; }
  .panel { width: min(380px, 92vw); padding: 26px 24px 22px; text-align: center; }
  .panel h1 { font-size: 34px; font-weight: 900; }
  .panel p { margin-top: 8px; line-height: 1.45; opacity: .8; }
  .panel .board { margin-top: 12px; text-align: left; }
  .panel button { margin-top: 18px; padding: 13px 36px; border: 0; border-radius: 999px; background: #3a86ff; color: #fff;
    font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 16px rgba(58,134,255,.45); }
  .panel button:hover { filter: brightness(1.08); }
  .panel button:focus-visible { outline: 3px solid #1d2340; outline-offset: 3px; }
  #joy { position: fixed; z-index: 4; display: none; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.8); background: rgba(255,255,255,.15); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #stat { text-align: center; font-size: 13px; font-weight: 800; color: #e76f51; }
  .ui-btn { position: fixed; z-index: 7; display: none; border: 0; font: inherit; font-weight: 900; cursor: pointer; color: #1d2340; }
  body.playing .ui-btn { display: block; }
  #pauseBtn { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); padding: 9px 13px; font-size: 14px; }
  #endBtn { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(62px + env(safe-area-inset-left, 0px)); padding: 9px 14px; font-size: 14px; }
  #dashBtn { right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px;
    border-radius: 50%; background: #3a86ff; color: #fff; font-size: 15px; box-shadow: 0 6px 16px rgba(58,134,255,.45); }
  #dashBtn.cool { opacity: .35; }
  #rotate { display: none; position: fixed; z-index: 8; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 8px 14px; border-radius: 12px;
    background: rgba(29,35,64,.85); color: #fff; font-size: 13px; font-weight: 700; pointer-events: none; white-space: nowrap; }
  @media (pointer: coarse) and (orientation: portrait) { #rotate { display: block; } }
  .modes { display: grid; gap: 10px; margin-top: 16px; }
  .panel .modes button { margin: 0; padding: 11px 14px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; }
  .modes small { font-weight: 600; font-size: 12px; opacity: .9; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .panel button.alt { background: #e9ecef; color: #1d2340; box-shadow: none; }
  @media (max-width: 520px) { #hud { width: 168px; } #timer { font-size: 24px; } .board li { font-size: 12px; padding: 3px 5px; } }
</style>
</head>
<body>
<div id="hud" class="card"><div id="timer">2:00</div><div id="stat"></div><ol id="board" class="board"></ol></div>
<button id="pauseBtn" class="ui-btn card" aria-label="Pause">⏸</button>
<button id="endBtn" class="ui-btn card">End round</button>
<div id="rotate">↻ Turn your phone sideways for the best view</div>
<button id="dashBtn" class="ui-btn">DASH</button>
<div id="toast" class="card"></div>
<div id="joy"><div id="knob"></div></div>
<div id="overlay"><div id="panel" class="panel card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  /* ================= CONFIG ================= */
  const CFG = {
    duration: 120,  // round length (s)
    startR: 1.1,    // starting hole radius
    maxR: Infinity, // no size cap
    grow: 0.45,     // area gained per object = grow * size^2
    eatRatio: 1.15, // how much bigger a hole must be to swallow another hole
    respawn: 3,     // seconds before a swallowed hole returns
    protect: 3,     // spawn protection (s)
    blocks: 20,     // city is blocks x blocks
    bound: 306,     // half-size of the playable city (blocks/2 * pitch + 6)
    pitch: 30,      // road-to-road distance
  };
  const HOLE_DEFS = [
    { name: 'You', color: '#3a86ff', ai: false },
    { name: 'Vortex', color: '#ff006e', ai: true },
    { name: 'Gulp', color: '#fb8500', ai: true },
    { name: 'Abyss', color: '#8338ec', ai: true },
    { name: 'Nomnom', color: '#06a77d', ai: true },
  ];
  const B = CFG.bound, S = CFG.pitch, TAU = Math.PI * 2, HALF_PI = Math.PI / 2, W = '#ffffff';
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const speedOf = (r) => Math.min(52, 8.5 + r * 0.9);
  const $ = (id) => document.getElementById(id);
  // Straight street grid plus a few real curves: a winding river (streets cross it on bridges) and a ring road.
  const RIVER = { off: 95, a1: 55, w1: 1 / 170, p1: 0.8, a2: 22, w2: 1 / 67, p2: 2.0, half: 7, bank: 9.5 };
  const riverX = (z) => RIVER.off + RIVER.a1 * Math.sin(z * RIVER.w1 + RIVER.p1) + RIVER.a2 * Math.sin(z * RIVER.w2 + RIVER.p2);
  const riverSlope = (z) => RIVER.a1 * RIVER.w1 * Math.cos(z * RIVER.w1 + RIVER.p1) + RIVER.a2 * RIVER.w2 * Math.cos(z * RIVER.w2 + RIVER.p2);
  const riverDist = (x, z) => Math.abs(x - riverX(z)) / Math.hypot(1, riverSlope(z));
  const RING = 165; // ring road radius around downtown
  const ringDist = (x, z) => Math.abs(Math.hypot(x, z) - RING);

  /* ================= RENDERER / SCENE / LIGHTS ================= */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  document.body.prepend(renderer.domElement);
  const canvas = renderer.domElement;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3ff);
  scene.fog = new THREE.Fog(0xbfe3ff, 40, 120);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 8000);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xb7c9a8, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.03;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 1200;
  scene.add(sun, sun.target);

  /* ================= GROUND WITH HOLE CUT-OUTS =================
     The ground shader discards every fragment inside a hole's circle, so the dark pit
     and falling objects below y=0 show through. Depth testing does all the clipping. */
  const NH = HOLE_DEFS.length;
  const holeUniform = { value: HOLE_DEFS.map(() => new THREE.Vector3()) };
  // one texel per city block says what ground to paint there (grass, paving, concrete, parking, pond, dirt)
  const kindData = new Uint8Array(CFG.blocks * CFG.blocks * 4);
  const kindTex = new THREE.DataTexture(kindData, CFG.blocks, CFG.blocks, THREE.RGBAFormat);
  kindTex.magFilter = kindTex.minFilter = THREE.NearestFilter;
  // one texel per street segment: R = the line running along z, G = the line running along x (0 none, 1 street, 2 country lane)
  const segData = new Uint8Array((CFG.blocks + 1) * CFG.blocks * 4);
  const segTex = new THREE.DataTexture(segData, CFG.blocks + 1, CFG.blocks, THREE.RGBAFormat);
  segTex.magFilter = segTex.minFilter = THREE.NearestFilter;
  const groundMat = new THREE.MeshLambertMaterial();
  groundMat.onBeforeCompile = (sh) => {
    sh.uniforms.uHoles = holeUniform;
    sh.uniforms.uKinds = { value: kindTex };
    sh.uniforms.uSegs = { value: segTex };
    sh.vertexShader = 'varying vec3 vWPos;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      '#include <project_vertex>\n  vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = `
      uniform vec3 uHoles[${NH}];
      uniform sampler2D uKinds, uSegs;
      varying vec3 vWPos;
      vec3 street(float dA, float dB, float along, float across, bool ave) {
        if (dB > 4.3 && dB < 5.5 && dA < 3.7 && mod(across, 1.0) < 0.5) return vec3(0.92);            // crosswalk
        if (ave && dA < 0.75 && dB > 4.0) return dA < 0.6 ? vec3(0.42, 0.63, 0.34) : vec3(0.78);     // avenue median
        if (!ave && dA < 0.15 && dB > 5.6 && mod(along, 4.0) < 2.0) return vec3(0.98, 0.84, 0.32);    // centre dashes
        return vec3(0.34, 0.36, 0.42);
      }
      vec3 cityColor(vec2 p) {
        if (max(abs(p.x), abs(p.y)) > ${B.toFixed(1)}) return vec3(0.46, 0.68, 0.40);
        float rx = ${RIVER.off.toFixed(5)} + ${RIVER.a1.toFixed(5)} * sin(p.y * ${RIVER.w1.toFixed(5)} + ${RIVER.p1.toFixed(5)}) + ${RIVER.a2.toFixed(5)} * sin(p.y * ${RIVER.w2.toFixed(5)} + ${RIVER.p2.toFixed(5)});
        float sl = ${RIVER.a1.toFixed(5)} * ${RIVER.w1.toFixed(5)} * cos(p.y * ${RIVER.w1.toFixed(5)} + ${RIVER.p1.toFixed(5)}) + ${RIVER.a2.toFixed(5)} * ${RIVER.w2.toFixed(5)} * cos(p.y * ${RIVER.w2.toFixed(5)} + ${RIVER.p2.toFixed(5)});
        float river = abs(p.x - rx) / sqrt(1.0 + sl * sl), ring = abs(length(p) - ${RING.toFixed(1)});
        if (ring < 4.0) return ring < 0.15 && mod(atan(p.y, p.x) * ${RING.toFixed(1)}, 4.0) < 2.0 ? vec3(0.98, 0.84, 0.32) : vec3(0.34, 0.36, 0.42);
        vec2 kk = floor(p / ${S.toFixed(1)} + 0.5), d = abs(p - kk * ${S.toFixed(1)}), bi = floor(p / ${S.toFixed(1)}), l = p - (bi + 0.5) * ${S.toFixed(1)};
        vec2 segSize = vec2(${(CFG.blocks + 1).toFixed(1)}, ${CFG.blocks.toFixed(1)});
        float tx = floor(texture2D(uSegs, (vec2(kk.x, bi.y) + ${(CFG.blocks / 2).toFixed(1)} + 0.5) / segSize).r * 255.0 + 0.5);
        float tz = floor(texture2D(uSegs, (vec2(kk.y, bi.x) + ${(CFG.blocks / 2).toFixed(1)} + 0.5) / segSize).g * 255.0 + 0.5);
        vec3 lane = vec3(0.45, 0.44, 0.41), verge = vec3(0.52, 0.74, 0.42), walk = vec3(0.86, 0.84, 0.79);
        bool dry = river > ${RIVER.bank.toFixed(5)};
        if (tx > 0.5 && d.x < 5.6) {
          if (tx > 1.5) { if (d.x < 2.6) return lane; if (d.y > 5.6 && dry) return verge; }
          else { if (d.x < 4.0) return street(d.x, d.y, p.y, p.x, mod(kk.x, 4.0) < 0.5); if (d.y > 4.0 || tz < 0.5) return walk; }
        }
        if (tz > 0.5 && d.y < 5.6) {
          if (tz > 1.5) { if (d.y < 2.6) return lane; if (d.x > 5.6 && dry) return verge; }
          else { if (d.y < 4.0) return street(d.y, d.x, p.x, p.y, mod(kk.y, 4.0) < 0.5); return walk; }
        }
        if (ring < 5.6) return walk;                                                                  // ring road sidewalks
        if (river < ${RIVER.half.toFixed(5)}) return vec3(0.20, 0.50, 0.78) + 0.03 * sin(p.x * 0.9 + p.y * 0.35); // river
        if (!dry) return vec3(0.72, 0.70, 0.66);                                                      // stone embankment
        float code = floor(texture2D(uKinds, (bi + ${(CFG.blocks / 2).toFixed(1)} + 0.5) / ${CFG.blocks.toFixed(1)}).r * 255.0 + 0.5);
        if (code == 1.0) return mod(floor(l.x / 1.5) + floor(l.y / 1.5), 2.0) < 1.0 ? vec3(0.80, 0.79, 0.75) : vec3(0.75, 0.74, 0.70);
        if (code == 2.0) return vec3(0.62, 0.62, 0.60);
        if (code == 3.0) {
          float row = min(abs(abs(l.y) - 2.2), abs(abs(l.y) - 6.5));
          return row < 1.25 && abs(l.x) < 8.6 && mod(l.x + 0.07, 2.8) < 0.14 ? vec3(0.95) : vec3(0.38, 0.39, 0.43);
        }
        if (code == 4.0) { float rr = length(l); if (rr < 5.2) return vec3(0.25, 0.58, 0.82); if (rr < 5.7) return vec3(0.80, 0.74, 0.60); }
        if (code == 5.0) return vec3(0.64, 0.52, 0.38);
        if (code == 6.0) return mod(l.x + 0.4 * sin(l.y * 0.25), 2.4) < 1.2 ? vec3(0.50, 0.68, 0.28) : vec3(0.60, 0.50, 0.33); // crop rows
        if (code == 7.0) { // school sports field
          vec2 f = l - vec2(0.0, 3.5);
          if (abs(f.x) < 8.0 && abs(f.y) < 5.0) {
            bool ln = abs(abs(f.x) - 7.9) < 0.1 || abs(abs(f.y) - 4.9) < 0.1 || abs(f.x) < 0.07 || abs(length(f) - 1.8) < 0.07;
            return ln ? vec3(0.95) : (mod(f.x, 2.0) < 1.0 ? vec3(0.40, 0.70, 0.35) : vec3(0.36, 0.64, 0.31));
          }
          return vec3(0.80, 0.79, 0.75);
        }
        return vec3(0.58, 0.82, 0.47);
      }
    ` + sh.fragmentShader
      .replace('void main() {', `void main() {
        for (int i = 0; i < ${NH}; i++) {
          vec3 h = uHoles[i];
          if (h.z > 0.0 && distance(vWPos.xz, h.xy) < h.z) discard;
        }`)
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );', 'vec4 diffuseColor = vec4( cityColor(vWPos.xz), opacity );');
  };
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), groundMat);
  ground.rotation.x = -HALF_PI;
  ground.receiveShadow = true;
  scene.add(ground);

  /* ================= HOLES: dark pit + coloured rim + name tag ================= */
  const pitGeo = new THREE.CylinderGeometry(1, 1, 1, 40, 4).translate(0, -0.5, 0);
  {
    const p = pitGeo.attributes.position, c = [];
    for (let i = 0; i < p.count; i++) { const t = 1 + p.getY(i), k = 0.2 * t * t; c.push(k, k, k * 1.3); }
    pitGeo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  }
  const pitMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide });
  const ringGeo = new THREE.RingGeometry(0.97, 1.07, 64).rotateX(-HALF_PI);

  const holes = HOLE_DEFS.map((d, idx) => {
    const pit = new THREE.Mesh(pitGeo, pitMat);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: d.color }));
    scene.add(pit, ring);
    const label = document.createElement('div');
    label.className = d.ai ? 'label' : 'label me';
    label.style.background = d.color;
    label.textContent = d.name;
    document.body.appendChild(label);
    return {
      ...d, idx, pit, ring, label, labelText: d.name, shown: true,
      x: 0, z: 0, vx: 0, vz: 0, r: CFG.startR, tr: CFG.startR, lastR: CFG.startR,
      px: 0, pz: 0, pr: CFG.startR, sx: 0, sz: 0, sr: CFG.startR, // previous / substep pose for the physics
      score: 0, pending: 0, dead: false, respawnT: 0, protect: 0,
      gx: 0, gz: 0, chase: null, chaseT: 0, huntCD: 0, thinkT: 0, target: null, stuckT: 0,
      skill: rnd(0.86, 0.95), aggr: rnd(0.7, 1.3),
      dashT: 0, dashCD: 0, combo: 0, lastEat: -9, eaten: 0,
    };
  });
  const player = holes[0];

  /* ================= LOW-POLY MODELS ================= */
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cyl = (a, b, h, s = 8) => new THREE.CylinderGeometry(a, b, h, s);
  const ball = (r) => new THREE.IcosahedronGeometry(r, 0);
  const cone = (r, h, s) => new THREE.ConeGeometry(r, h, s);

  // Merge primitive parts into one flat-shaded, vertex-coloured geometry (1 draw call per type)
  function mergeParts(parts) {
    const pos = [], nor = [], col = [], c = new THREE.Color();
    for (const [geo, color, x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0] of parts) {
      let g = geo.rotateZ(rz).rotateX(rx).rotateY(ry).translate(x, y, z);
      if (g.index) g = g.toNonIndexed();
      g.computeVertexNormals();
      c.set(color);
      const p = g.attributes.position.array, n = g.attributes.normal.array;
      for (let i = 0; i < p.length; i += 3) {
        pos.push(p[i], p[i + 1], p[i + 2]);
        nor.push(n[i], n[i + 1], n[i + 2]);
        col.push(c.r, c.g, c.b);
      }
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return out;
  }

  const wheels = [[-0.75, -0.55], [-0.75, 0.55], [0.75, -0.55], [0.75, 0.55]]
    .map(([x, z]) => [cyl(0.3, 0.3, 0.22, 10), '#1c1c1c', x, 0.3, z, 0, HALF_PI]);
  const Q4 = [[-1, -1], [1, -1], [-1, 1], [1, 1]], GLASS = '#26283a';
  const dome = (r) => new THREE.SphereGeometry(r, 16, 5, 0, TAU, 0, Math.PI / 2);
  const torus = (R, r, seg = 20, tube = 5) => new THREE.TorusGeometry(R, r, tube, seg);
  const rockG = (r) => new THREE.DodecahedronGeometry(r, 0);
  const personParts = (shirt, pants) => [
    [box(0.09, 0.42, 0.1), pants, 0, 0.21, 0.06], [box(0.09, 0.42, 0.1), pants, 0, 0.21, -0.06],
    [cyl(0.12, 0.13, 0.42, 7), shirt, 0, 0.63], [box(0.06, 0.36, 0.07), shirt, 0, 0.62, 0.17], [box(0.06, 0.36, 0.07), shirt, 0, 0.62, -0.17],
    [ball(0.1), '#e0ac69', 0, 0.94], [ball(0.09), '#3d2c1e', -0.02, 0.99]];
  const wheelsAt = (xs, z, r = 0.3, w = 0.22) => xs.flatMap((x) => [-z, z].map((zz) => [cyl(r, r, w, 7), '#1c1c1c', x, r, zz, 0, HALF_PI]));
  // req = rough hole radius needed (the physics decides for real), pts = score
  const TYPES = {
    hydrant: { req: 0.45, h: 0.8, pts: 1, parts: [
      [cyl(0.22, 0.25, 0.08), '#8d0801', 0, 0.04],
      [cyl(0.15, 0.17, 0.56), '#e63946', 0, 0.36],
      [cyl(0.21, 0.21, 0.08), '#e63946', 0, 0.64],
      [ball(0.14), '#d62828', 0, 0.72],
      [box(0.46, 0.09, 0.09), '#b5171f', 0, 0.42]] },

  const layout = [], NB = CFG.blocks / 2;
  let roadAxis = null; // non-null while placing street furniture (allowed on bridges)
  const GREEN = new Set(['tree', 'pine', 'bush', 'palm', 'rock']);
  const PEOPLE = ['person', 'person2', 'person3'];
  const add = (type, x, z, ry = rnd(0, TAU), s = 1, hs = 1) => {
    const rad = TYPES[type].req * s * 0.6, rd = riverDist(x, z), gd = ringDist(x, z);
    if (type === 'boat') { if (rd > RIVER.half - 2 && rd < RIVER.bank + 3) return; } // on the water, never on the bank
    else if (roadAxis === null || GREEN.has(type)) { if (rd < RIVER.bank + rad || gd < 5.6 + rad) return; }
    else if (gd < 4.5) return; // street furniture can't stand in the ring road
    layout.push({ type, x, z, ry, s, hs });
  };
  const VEHICLES = [['car', 2.4, 40], ['taxi', 2.4, 8], ['van', 2.6, 10], ['pickup', 3.0, 10], ['moto', 1.6, 8],
    ['boxtruck', 4.7, 7], ['bus', 6.4, 4], ['firetruck', 5.2, 2], ['semi', 8.7, 3]]; // [type, length, weight]
  const VW = VEHICLES.reduce((sum, v) => sum + v[2], 0);
  const pickVehicle = () => { let r = Math.random() * VW; for (const v of VEHICLES) if ((r -= v[2]) < 0) return v; return VEHICLES[0]; };

  // Districts first: skyline in the middle, city around it, suburbs, an industrial quarter, farmland at the edge
  const GROUND = { homes: 0, park: 0, apartments: 0, stadium: 0, church: 0, solar: 0, skyline: 1, downtown: 1, shops: 1, gas: 1, plaza: 1,
    cityhall: 1, amusement: 1, hospital: 1, industrial: 2, parking: 3, pond: 4, construction: 5, farm: 6, windfarm: 6, school: 7 };
  const RURAL = new Set(['farm', 'solar', 'windfarm']);
  const KIND = [];
  for (let ix = 0; ix < CFG.blocks; ix++) for (let iz = 0; iz < CFG.blocks; iz++) {
    const cx = ix - NB + 0.5, cz = iz - NB + 0.5, ring = Math.max(Math.abs(cx), Math.abs(cz)), r = Math.random();
    const kind = cx === 0.5 && cz === 2.5 ? 'cityhall'
      : (cx === -4.5 && cz === 4.5) || (cx === 4.5 && cz === -4.5) ? 'stadium'
      : (cx === -6.5 && cz === -3.5) || (cx === 5.5 && cz === 6.5) ? 'amusement'
      : ring < 2 ? (r < 0.6 ? 'skyline' : r < 0.8 ? 'downtown' : r < 0.9 ? 'plaza' : 'apartments')
      : ring < 3 ? (r < 0.15 ? 'skyline' : r < 0.33 ? 'downtown' : r < 0.5 ? 'apartments' : r < 0.64 ? 'shops' : r < 0.72 ? 'plaza' : r < 0.8 ? 'parking' : r < 0.86 ? 'hospital' : 'park')
      : ring > 7.9 ? (r < 0.45 ? 'farm' : r < 0.58 ? 'solar' : r < 0.7 ? 'windfarm' : r < 0.8 ? 'pond' : r < 0.9 ? 'homes' : 'park')
      : cx > 2 && cz > 2 && ring < 7 ? (r < 0.75 ? 'industrial' : r < 0.9 ? 'construction' : 'parking')
      : r < 0.38 ? 'homes' : r < 0.48 ? 'shops' : r < 0.56 ? 'apartments' : r < 0.64 ? 'park' : r < 0.69 ? 'pond' : r < 0.74 ? 'school'
      : r < 0.78 ? 'gas' : r < 0.82 ? 'parking' : r < 0.86 ? 'church' : r < 0.89 ? 'hospital' : r < 0.94 ? 'plaza' : 'construction';
    KIND.push(kind);
    kindData[(iz * CFG.blocks + ix) * 4] = GROUND[kind];
  }
  kindTex.needsUpdate = true;
  // Streets: some side streets are dropped (T-junctions, dead ends, merged blocks); between farms they're country lanes
  const segIdx = (k, seg) => ((seg + NB) * (CFG.blocks + 1) + (k + NB)) * 4;
  const kindAt = (ix, iz) => (ix < 0 || iz < 0 || ix >= CFG.blocks || iz >= CFG.blocks ? null : KIND[ix * CFG.blocks + iz]);
  for (let k = -NB; k <= NB; k++) for (let seg = -NB; seg < NB; seg++) for (const alongZ of [true, false]) {
    const A = alongZ ? kindAt(k + NB - 1, seg + NB) : kindAt(seg + NB, k + NB - 1);
    const Bk = alongZ ? kindAt(k + NB, seg + NB) : kindAt(seg + NB, k + NB);
    let type = (A === null || RURAL.has(A)) && (Bk === null || RURAL.has(Bk)) ? 2 : 1;
    if (type === 1 && Math.abs(k) < NB && k % 4 !== 0 && A !== 'stadium' && Bk !== 'stadium' && Math.random() < 0.13) type = 0;
    segData[segIdx(k, seg) + (alongZ ? 0 : 1)] = type;
  }
  segTex.needsUpdate = true;

  // Street furniture + parked cars on every street segment
  for (let k = -NB; k <= NB; k++) for (let seg = -NB; seg < NB; seg++) for (const alongZ of [true, false]) {
    const a = seg * S;
    roadAxis = alongZ ? 'z' : 'x';
    const at = (u, v) => (alongZ ? [k * S + v, u] : [u, k * S + v]); // u = along road, v = across
    const lampRy = (v) => (alongZ ? (v < 0 ? 0 : Math.PI) : v < 0 ? -HALF_PI : HALF_PI);
    const faceRoad = (v) => (alongZ ? (v > 0 ? -HALF_PI : HALF_PI) : v > 0 ? Math.PI : 0);
    const type = segData[segIdx(k, seg) + (alongZ ? 0 : 1)];
    if (type === 0) { // dropped street: a strip of greenery joins the two blocks
      for (let u = a + 9; u < a + 22; u += 6.5) if (Math.random() < 0.6) add(pick(['tree', 'pine', 'bush']), ...at(u, rnd(-2, 2)), undefined, rnd(0.8, 1.1));
      continue;
    }
    if (type === 2) { // country lane: trees on the verges, the odd tractor or pickup
      for (let u = a + 7; u < a + 24; u += rnd(4, 8)) if (Math.random() < 0.45) add(pick(['tree', 'tree', 'pine']), ...at(u, 4.2), undefined, rnd(0.8, 1.15));
      for (let u = a + 6; u < a + 24; u += 9) add('utilitypole', ...at(u, -3.6), alongZ ? 0 : HALF_PI); // power line
      if (Math.random() < 0.3) { const lane = pick([-1.3, 1.3]); add(pick(['tractor', 'tractor', 'pickup', 'van']), ...at(a + rnd(9, 21), lane), (alongZ ? HALF_PI : 0) + (lane > 0 ? Math.PI : 0)); }
      continue;
    }
    add('light', ...at(a + 10, -4.8), lampRy(-1));
    add('light', ...at(a + 20, 4.8), lampRy(1));
    if (Math.random() < 0.7) add('trafficlight', ...at(a + 6, 4.8), lampRy(1));
    if (Math.random() < 0.5) add('hydrant', ...at(a + 15, pick([-4.8, 4.8])));
    for (const v of [-4.8, 4.8]) { // bins, bags, crates, mailboxes, planters on both sidewalks
      for (const u of [7.6, 22.4]) {
        const rr = Math.random();
        if (rr < 0.45) { add('trash', ...at(a + u, v)); if (Math.random() < 0.5) add('bag', ...at(a + u + (u < 15 ? 0.9 : -0.9), v)); }
        else if (rr < 0.6) add('crate', ...at(a + u, v));
      }
      const m = Math.random(); // mid-block: bus stop, phone booth or mailbox
      if (m < 0.14) add('busstop', ...at(a + 12.5, v), faceRoad(v));
      else if (m < 0.24) add('phonebooth', ...at(a + 12.5, v));
      else if (m < 0.45) add('mailbox', ...at(a + 12.5, v));
      const g = Math.random(); // planting or parked bikes
      if (g < 0.3) add('bush', ...at(a + 17.5, v), undefined, rnd(0.8, 1.2));
      else if (g < 0.45) add('planter', ...at(a + 17.5, v));
      else if (g < 0.55) for (const du of [-0.45, 0.45]) add('bike', ...at(a + 17.5 + du, v + (v > 0 ? 0.3 : -0.3)), alongZ ? HALF_PI : 0);
      if (Math.random() < 0.35) add(pick(PEOPLE), ...at(a + pick([9.3, 19.1]), v + rnd(-0.5, 0.5))); // pedestrians
    }
    if (k % 4 === 0) for (let u = a + 8; u < a + 23; u += 5) add(Math.random() < 0.3 ? 'pine' : 'bush', ...at(u, 0), undefined, rnd(0.5, 0.6)); // avenue median
    if (Math.random() < 0.25) { // a row of traffic cones along the lane edge
      const u = rnd(9, 20), v = pick([-3.3, 3.3]);
      for (let c = 0; c < 3; c++) add('cone', ...at(a + u + c * 1.1, v));
    }
    for (const lane of [-2, 2]) { // a random line-up of parked vehicles in each lane
      for (let u = a + 6 + rnd(0, 2.5); ; ) {
        const [vt, len] = pickVehicle();
        if (u + len > a + 24) break;
        const heading = (alongZ ? HALF_PI : 0) + (lane > 0 ? Math.PI : 0);
        if (Math.random() < 0.5) add(vt, ...at(u + len / 2, lane), heading, vt === 'car' || vt === 'taxi' ? rnd(0.92, 1.05) : 1);
        u += len + rnd(0.8, 3.5);
      }
    }
  }

  roadAxis = null;
  // Blocks by district
  const QUADS = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
  const EDGES = [[8.4, 0], [-8.4, 0], [0, 8.4], [0, -8.4]];
  const ROT = [0, HALF_PI];
  const anyTree = () => pick(['tree', 'tree', 'pine']);
  const facing = (qx, qz) => (Math.random() < 0.5 ? (qx > 0 ? HALF_PI : -HALF_PI) : qz > 0 ? 0 : Math.PI); // front faces a street
  function alleyClutter(bx, bz) {
    for (const [ex, ez] of EDGES) {
      const r = Math.random(), x = bx + ex, z = bz + ez;
      if (r < 0.35) add('dumpster', x, z, ex ? HALF_PI : 0);
      else if (r < 0.6) { add('crate', x, z); add('crate', x + (ex ? 0 : 0.9), z + (ex ? 0.9 : 0)); }
      else if (r < 0.85) { add('trash', x, z); add('bag', x + (ex ? 0 : -0.9), z + (ex ? -0.9 : 0)); }
    }
  }
  for (let ix = 0; ix < CFG.blocks; ix++) for (let iz = 0; iz < CFG.blocks; iz++) {
    const cx = ix - NB + 0.5, cz = iz - NB + 0.5, bx = cx * S, bz = cz * S;
    const kind = KIND[ix * CFG.blocks + iz];
    if (kind === 'stadium') add('stadium', bx, bz, 0);
    else if (kind === 'skyline') {
      const v = Math.random();
      if (v < 0.3) add('sky', bx, bz, pick(ROT), rnd(0.92, 1.04), rnd(0.75, 1.35)); // one supertall
      else if (v < 0.45) add('roundtower', bx, bz, 0, rnd(0.9, 1.05), rnd(0.8, 1.3));
      else if (v < 0.8) QUADS.forEach(([qx, qz], i) => (i === 0 || i === 3) // twin towers + two offices
        ? add('sky', bx + qx * 4.6, bz + qz * 4.6, pick(ROT), rnd(0.5, 0.56), rnd(0.9, 1.5))
        : add('office', bx + qx * 4.6, bz + qz * 4.6, pick(ROT), rnd(0.72, 0.8), rnd(0.9, 1.8)));
      else for (const [qx, qz] of QUADS) add('office', bx + qx * 4.6, bz + qz * 4.6, pick(ROT), rnd(0.72, 0.8), rnd(1.1, 2.1));
      for (const [qx, qz] of QUADS) add(pick(['trash', 'bench', 'bush', 'planter']), bx + qx * 8.4, bz + qz * 8.4, pick(ROT));
      for (let i = 0; i < 4; i++) add(pick(PEOPLE), bx + rnd(-8.8, 8.8), bz + pick([-8.9, 8.9]));
    } else if (kind === 'downtown') {
      if (Math.random() < 0.3) add('office', bx, bz, pick(ROT), rnd(1.15, 1.3), rnd(1.4, 1.7));
      else {
        for (const [qx, qz] of QUADS) {
          if (Math.random() < 0.85) add('office', bx + qx * 4.6, bz + qz * 4.6, pick(ROT), rnd(0.7, 0.8), rnd(0.55, 1.3));
          else add(anyTree(), bx + qx * 4.6, bz + qz * 4.6);
        }
        add('bench', bx, bz, pick(ROT));
      }
      alleyClutter(bx, bz);
    } else if (kind === 'apartments') {
      for (const qz of [-1, 1]) add('apartment', bx, bz + qz * 4.6, qz > 0 ? 0 : Math.PI, 1, rnd(0.7, 1.6)); // balconies face the street
      for (const [qx, qz] of QUADS) if (Math.random() < 0.7) add(anyTree(), bx + qx * 7.4, bz + qz * 4.6);
      for (const x of [-5, 0, 5]) add(pick(['bench', 'picnic', 'slide', 'planter', 'dumpster']), bx + x, bz, 0);
      if (Math.random() < 0.6) add(pick(PEOPLE), bx + rnd(-7, 7), bz + 0.9);
    } else if (kind === 'shops') {
      for (const [qx, qz] of QUADS) add('shop', bx + qx * 4.8, bz + qz * 4.8, facing(qx, qz), rnd(0.9, 1.05));
      add('dumpster', bx, bz, pick(ROT));
      for (let i = 0; i < 4; i++) add(pick(PEOPLE), bx + rnd(-8.5, 8.5), bz + pick([-8.7, 8.7]));
      if (Math.random() < 0.3) add('billboard', bx + pick([-8.7, 8.7]), bz, HALF_PI);
    } else if (kind === 'gas') {
      add('gas', bx, bz + 1.2, pick([0, Math.PI]));
      add('car', bx - 7, bz - 6, HALF_PI);
      add(pick(['van', 'pickup', 'car']), bx - 7, bz + 3, HALF_PI);
      add(anyTree(), bx + 7.5, bz - 7.5); add(anyTree(), bx + 7.5, bz + 7.5);
      add('trash', bx - 7.5, bz + 7.5); add('bush', bx + 7.5, bz);
    } else if (kind === 'industrial') {
      const v = Math.random();
      if (v < 0.4) { // big warehouse with trucks at the loading side
        add('warehouse', bx, bz - 1.2, pick([0, Math.PI]), rnd(0.9, 1), rnd(0.9, 1.3));
        add(Math.random() < 0.6 ? 'semi' : 'boxtruck', bx - 3.5, bz + 7.8, pick([0, Math.PI]));
        add(Math.random() < 0.5 ? 'boxtruck' : 'pickup', bx + 4.4, bz + 7.8, pick([0, Math.PI]));
        add('dumpster', bx + 8.3, bz - 1.2, HALF_PI);
        add('crate', bx - 8.4, bz - 3); add('crate', bx - 8.4, bz - 2.1);
      } else if (v < 0.7) { // water tower + small warehouse
        add('watertower', bx - 5, bz - 5);
        add('warehouse', bx + 3.4, bz + 3.6, 0, 0.55, rnd(1, 1.4));
        add(pick(['boxtruck', 'semi', 'pickup']), bx - 5, bz + 4.6, pick([HALF_PI, -HALF_PI]));
        add('dumpster', bx + 5, bz - 5, 0);
        add('crate', bx + 1.6, bz - 6.2); add('crate', bx + 1.6, bz - 5.3);
      } else { // container yard
        for (const z of [-6, -3, 0, 3, 6]) for (const x of [-4.2, 3.2]) if (Math.random() < 0.85) add('container', bx + x, bz + z, pick([0, Math.PI]));
        add('semi', bx - 0.5, bz + 8.4, pick([0, Math.PI]));
      }
    } else if (kind === 'plaza') { // fountain square
      add(Math.random() < 0.6 ? 'fountain' : 'statue', bx, bz, rnd(0, TAU));
      for (const [qx, qz] of QUADS) {
        add(anyTree(), bx + qx * 7, bz + qz * 7);
        add('bench', bx + qx * 4.3, bz + qz * 4.3, qx * qz > 0 ? -Math.PI / 4 : Math.PI / 4);
      }
      for (const [ex, ez] of EDGES) add(Math.random() < 0.5 ? 'trash' : 'planter', bx + ex, bz + ez);
      for (let i = 0; i < 7; i++) { const a = rnd(0, TAU), rr = rnd(3.7, 5.8); add(pick(PEOPLE), bx + Math.cos(a) * rr, bz + Math.sin(a) * rr); }
      add('cafe', bx + 7.6, bz - 2.6); add('cafe', bx + 7.6, bz + 2.6); add('foodtruck', bx - 7.5, bz, HALF_PI);
    } else if (kind === 'parking') { // striped lot, cars nose-in facing the aisles
      for (const z of [-6.5, -2.2, 2.2, 6.5]) for (let x = -7; x <= 7.1; x += 2.8)
        if (Math.random() < 0.6) add(pick(['car', 'car', 'car', 'taxi', 'van', 'pickup']), bx + x, bz + z, (z > 0) === (Math.abs(z) > 4) ? HALF_PI : -HALF_PI);
      add('trash', bx + 8.6, bz); add('trash', bx - 8.6, bz);
      if (Math.random() < 0.4) add('billboard', bx, bz + 9, 0);
    } else if (kind === 'pond') { // park around a pond
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * TAU + rnd(-0.2, 0.2), rr = rnd(6.8, 8.4);
        add(Math.random() < 0.3 ? 'palm' : anyTree(), bx + Math.cos(a) * rr, bz + Math.sin(a) * rr, undefined, rnd(0.8, 1.1));
      }
      add('bench', bx, bz - 6, 0); add('bench', bx, bz + 6, Math.PI);
      for (let i = 0; i < 2; i++) add('boat', bx + rnd(-2.5, 2.5), bz + rnd(-2.5, 2.5), rnd(0, TAU), 0.45); // paddle boats
      for (let i = 0; i < 3; i++) add(pick(PEOPLE), bx + pick([-6, 6]) + rnd(-0.5, 0.5), bz + rnd(-3, 3));
    } else if (kind === 'construction') { // tower crane, half-built block, site clutter
      add('crane', bx - 5.5, bz - 5.5, rnd(0, TAU));
      add('office', bx + 3.5, bz + 3.5, 0, 0.75, rnd(0.25, 0.45));
      add('container', bx - 5, bz + 6, 0);
      add('boxtruck', bx + 4, bz - 6.5, 0);
      for (let k = 0; k < 5; k++) add('cone', bx - 1 + k * 1.1, bz - 2.5);
      add('dumpster', bx + 8.2, bz - 1.5, HALF_PI); add('crate', bx - 8.4, bz); add('crate', bx - 8.4, bz + 0.9);
    } else if (kind === 'farm') { // barn and silo, hay bales in the field, a tractor
      const side = pick([-1, 1]);
      add('barn', bx + side * 4.5, bz - 4.5, pick([0, Math.PI]));
      add('silo', bx - side * 2.2, bz - 5);
      if (Math.random() < 0.5) { for (let i = 0; i < 6; i++) if (Math.random() < 0.8) add('hay', bx - 7 + i * 2.8 + rnd(-0.4, 0.4), bz + rnd(2.5, 8)); }
      else { const herd = pick(['cow', 'sheep']); for (let i = 0; i < 6; i++) add(herd, bx - 7 + i * 2.8 + rnd(-0.4, 0.4), bz + rnd(2.5, 8)); } // pasture
      add('tractor', bx + rnd(-3, 3), bz + 0.4, pick([0, Math.PI]));
    } else if (kind === 'church') {
      add('church', bx, bz, pick([0, HALF_PI, Math.PI, -HALF_PI]));
      for (const [qx, qz] of QUADS) add(anyTree(), bx + qx * 7.6, bz + qz * 7.6);
    } else if (kind === 'cityhall') { // domed city hall on a square
      add('cityhall', bx, bz, 0);
      add('statue', bx - 7.3, bz + 8.2, 0); add('statue', bx + 7.3, bz + 8.2, 0);
      for (let i = 0; i < 8; i++) add(pick(PEOPLE), bx + rnd(-5, 5), bz + rnd(7.9, 9));
    } else if (kind === 'amusement') { // Ferris wheel, carousel, food trucks, crowds
      add('ferris', bx, bz - 5, 0);
      add('carousel', bx - 4, bz + 4.5, 0);
      add('foodtruck', bx + 5, bz + 3, HALF_PI); add('cafe', bx + 7.6, bz + 6.5); add('cafe', bx + 5.2, bz + 8);
      for (let i = 0; i < 10; i++) add(pick(PEOPLE), bx + rnd(1, 8.5), bz + rnd(-1.5, 1.2));
    } else if (kind === 'school') { // school building + sports field
      add('school', bx, bz - 5.2, 0);
      for (let i = 0; i < 6; i++) add(pick(PEOPLE), bx + rnd(-7, 7), bz + rnd(0, 8), undefined, 0.85);
    } else if (kind === 'hospital') {
      add('hospital', bx, bz - 0.5, pick([0, Math.PI]));
      add('van', bx + 6, bz + 7.6, 0);
      for (let i = 0; i < 3; i++) add(pick(PEOPLE), bx + rnd(-2, 5), bz + rnd(6, 8.8));
      add(anyTree(), bx - 8, bz + 8); add(anyTree(), bx - 8, bz - 8);
    } else if (kind === 'solar') { // solar farm: rows of tilted panels
      for (const z of [-7.5, -4.5, -1.5, 1.5, 4.5, 7.5]) for (const x of [-5.6, 0, 5.6]) add('solar', bx + x, bz + z, 0);
    } else if (kind === 'windfarm') { // turbines over grazing land
      add('turbine', bx - 4, bz - 4, rnd(0, TAU)); add('turbine', bx + 4.5, bz + 4.5, rnd(0, TAU));
      for (let i = 0; i < 5; i++) add(Math.random() < 0.5 ? 'cow' : 'sheep', bx + rnd(-8, 8), bz + rnd(-8, 8));
    } else if (kind === 'homes') {
      for (const [qx, qz] of QUADS) {
        add('house', bx + qx * 4.8, bz + qz * 4.8, facing(qx, qz), rnd(0.9, 1.06));
        if (Math.random() < 0.75) add('trash', bx + qx * 8.4, bz + qz * 8.4);
        if (Math.random() < 0.45) add('bag', bx + qx * 7.5, bz + qz * 8.6);
        if (Math.random() < 0.5) add('bush', bx + qx * 8.5, bz + qz * 3.2, undefined, rnd(0.8, 1.1));
      }
      add(anyTree(), bx, bz);
      if (Math.random() < 0.4) add(pick(PEOPLE), bx + rnd(-1.8, 1.8), bz + 2.1);
      for (const [ex, ez] of [[8, 0], [-8, 0], [0, 8], [0, -8]]) if (Math.random() < 0.6) add(anyTree(), bx + ex, bz + ez, undefined, rnd(0.85, 1.1));
    } else { // park: playground, gazebo garden, or a wooded park
      const v = Math.random();
      if (v < 0.35) {
        add('slide', bx - 4, bz - 3.5, 0); add('swings', bx + 3.5, bz - 3.5, 0);

    if (m < 1e-6) return;
    _f.copy(_dv).multiplyScalar(1 / m);
    const w = invMassAt(a, c.ra, _f) + (b ? invMassAt(b, c.rb, _f) : 0);
    if (w <= 0) return;
    _f.multiplyScalar(m / w);
    applyVel(a, _f, c.ra, 1);
    if (b) applyVel(b, _f, c.rb, -1);
    if (-c.vnPre > 1.5) { if (b && !b.awake) wakeLater.push(b); if (!a.awake) wakeLater.push(a); } // hard knocks wake sleepers
  }

  /* ---------- step ---------- */
  function physicsStep(dt) {
    if (dt <= 0) return;
    for (const H of holes) { // a hole that moved or grew wakes whatever it now reaches
      if (H.dead || (H.x === H.px && H.z === H.pz && H.r === H.pr)) continue;
      forNear(H.x, H.z, H.r + 0.5, (o) => { // its footprint now overlaps the hole
        const b = o.bb, dx = Math.max(b[0] - H.x, 0, H.x - b[1]), dz = Math.max(b[2] - H.z, 0, H.z - b[3]);
        if (dx * dx + dz * dz < (H.r + 0.3) ** 2) wake(o);
      });
    }
    pairs.length = 0; // broadphase once per frame; bodies deep in a pit don't need to collide
    const deep = (o) => o.p.y < -0.5 * o.br;
    const skip = (a, b) => (deep(a) && deep(b)) || (a.br < 1 && b.br < 1 && (a.p.y < a.br || b.p.y < b.br)); // tiny clutter tumbling together
    for (let i = 0; i < awake.length && pairs.length < PHYS.maxPairs * 2; i++) {
      const a = awake[i], m = a.br + 0.5;
      for (let j = i + 1; j < awake.length; j++) {
        const b = awake[j];
        if (!skip(a, b) && a.p.distanceToSquared(b.p) < (m + b.br) ** 2) pairs.push(a, b);
      }
      if (!deep(a)) forNear(a.p.x, a.p.z, m, (b) => {
        if (a.p.distanceToSquared(b.p) < (m + b.br) ** 2) { if (!b.sp) buildPoints(b); pairs.push(a, b); }
      });
    }
    const n = awake.length > 120 ? 2 : PHYS.substeps, h = dt / n; // crowds: fewer substeps keep the frame smooth
    for (let s = 1; s <= n; s++) {
      const f = s / n;
      for (const H of holes) { H.sx = H.px + (H.x - H.px) * f; H.sz = H.pz + (H.z - H.pz) * f; H.sr = H.pr + (H.r - H.pr) * f; }
      for (const o of awake) integrate(o, h);
      nC = 0;
      for (const o of awake) collectGround(o);
      for (let k = 0; k < pairs.length; k += 2) { collectPair(pairs[k], pairs[k + 1]); collectPair(pairs[k + 1], pairs[k]); }
      for (let k = 0; k < nC; k++) solvePosition(C[s & 1 ? nC - 1 - k : k]); // alternate order: no drift bias
      for (const o of awake) deriveVelocity(o, h);
      for (let k = 0; k < nC; k++) solveVelocity(C[k], h);
    }
    for (const H of holes) { H.px = H.x; H.pz = H.z; H.pr = H.r; }
    for (const o of wakeLater) wake(o);
    wakeLater.length = 0;
    for (let k = awake.length - 1; k >= 0; k--) { // swallow, sleep, render
      const o = awake[k];
      if (!Number.isFinite(o.p.x + o.p.y + o.p.z + o.q.x + o.q.y + o.q.z + o.q.w)) { o.p.copy(o.bp); o.q.copy(o.bq); o.still = 9; } // safety net
      if (o.p.y < -(o.br + 3)) { consume(o); awake[k] = awake[awake.length - 1]; awake.pop(); continue; }
      const calm = o.still >= 9 || (o.v.lengthSq() < 0.04 && o.w.lengthSq() < 0.04 && o.p.y > 0);
      o.still = calm ? o.still + dt : 0;
      if (o.still > 0.5) { // at rest: freeze exactly where it ended up (a fallen lamppost stays fallen)
        o.awake = false; o.v.set(0, 0, 0); o.w.set(0, 0, 0);
        gridAdd(o);
        awake[k] = awake[awake.length - 1]; awake.pop();
      }
      place(o);
    }
  }

  /* ---------- swallowing & regrowth ---------- */
  function consume(o, hole) {
    let h = hole;
    if (!h) {
      let best = Infinity;
      for (const H of holes) { if (H.dead) continue; const d = Math.hypot(o.p.x - H.x, o.p.z - H.z) - H.r; if (d < best) { best = d; h = H; } }
    }
    o.state = 2; o.awake = false; o.v.set(0, 0, 0); o.w.set(0, 0, 0);
    o.rt = o.req > 3 ? rnd(40, 70) : rnd(18, 40); // regrow timer
    eaten.push(o);
    place(o);
    if (!h) return;
    let pts = o.pts * (o.gold ? 5 : 1);
    if (h === player) { // combo: keep eating within 1.2 s to build a multiplier (up to x2)
      player.combo = clock - player.lastEat < 1.2 ? player.combo + 1 : 1;
      player.lastEat = clock; player.eaten++;
      pts = Math.round(pts * (1 + Math.min(player.combo - 1, 20) * 0.05));
      player.pending += pts;
      if (o.gold) toast(`✨ Golden ${o.T.key}! +${pts}`);
    }
    h.score += pts;
    if (!h.dead) h.tr = Math.min(CFG.maxR, Math.hypot(h.tr, Math.sqrt(CFG.grow) * o.req));
  }
  function consumeInPit(h) { // a hole got swallowed: whatever was sinking in it is gone too
    for (let k = awake.length - 1; k >= 0; k--) {
      const o = awake[k];
      if (o.p.y < 0 && Math.hypot(o.p.x - h.x, o.p.z - h.z) < h.r + o.req) { consume(o, h); awake[k] = awake[awake.length - 1]; awake.pop(); }
    }
  }
  function respawnObjects(dt) {
    for (let k = eaten.length - 1; k >= 0; k--) {
      const o = eaten[k];
      if ((o.rt -= dt) > 0) continue;
      let blocked = holes.some((H) => !H.dead && Math.hypot(H.x - o.bp.x, H.z - o.bp.z) < H.r + o.req + 4);
      const clear = 0.7 * o.req; // is something lying on its spot?
      if (!blocked) forNear(o.bp.x, o.bp.z, clear, (b) => {
        const B2 = b.bb, dx = Math.max(B2[0] - o.bp.x, 0, o.bp.x - B2[1]), dz = Math.max(B2[2] - o.bp.z, 0, o.bp.z - B2[3]);
        if (dx * dx + dz * dz < clear * clear) blocked = true;

      if (blocked) { o.rt = rnd(2, 5); continue; }

      Object.assign(o, { state: 0, awake: false, still: 0, pop: 0, pt: 0 });

  }

  /* ================= HOLE MOVEMENT / AI / COMBAT ================= */
  function updateHole(h, dt) {
    if (h.dead) { if ((h.respawnT -= dt) <= 0) respawn(h); return; }
    h.protect = Math.max(0, h.protect - dt);
    h.dashT -= dt; h.dashCD -= dt;
    let [dx, dz] = h.ai ? aiSteer(h, dt) : playerSteer();
    if (h.dashT > 0 && !dx && !dz) { const l = Math.hypot(h.vx, h.vz); if (l > 0.1) { dx = h.vx / l; dz = h.vz / l; } }
    const boost = h.dashT > 0 ? 2.3 : 1;
    const sp = speedOf(h.r) * (h.ai ? h.skill : 1) * boost, k = Math.min(1, dt * (h.dashT > 0 ? 14 : 8));
    h.vx += (dx * sp - h.vx) * k;
    h.vz += (dz * sp - h.vz) * k;

    h.z = clamp(h.z + h.vz * dt, -B - 6, B + 6);

  }
  function dash(h) { if (!h.dead && h.dashCD <= 0) { h.dashT = 0.35; h.dashCD = 3; } }

  function aiThink(h) {
    const range = 18 + h.r * 5;
    h.fleeing = false;
    let fx = 0, fz = 0, bestV = 0, best = null, prey = null;
    for (const o of holes) {
      if (o === h || o.dead) continue;
      const dx = h.x - o.x, dz = h.z - o.z, d = Math.hypot(dx, dz) || 0.01;
      if (o.r > h.r * 1.12) { // bigger hole nearby: flee
        const danger = o.r + h.r + 8;
        if (d < danger) { fx += (dx / d) * (danger - d); fz += (dz / d) * (danger - d); }
      } else if (h.huntCD <= 0 && o.protect <= 0 && h.r > o.r * 1.22 && d < range) { // smaller hole: prey
        const v = (h.aggr * (12 + o.r * o.r * 4)) / (d + 4);
        if (v > bestV) { bestV = v; prey = o; }
      }
    }
    if (fx || fz) {
      const l = Math.hypot(fx, fz);
      h.gx = clamp(h.x + (fx / l) * 25, 8 - B, B - 8);
      h.gz = clamp(h.z + (fz / l) * 25, 8 - B, B - 8);
      h.chase = h.target = null; h.fleeing = true;
      return;
    }
    for (const o of objects) { // most valuable object that clearly fits (it has to physically drop in)
      if (o.state || o.req >= h.r * 0.88 || o.skip > clock) continue;
      const dx = o.p.x - h.x, dz = o.p.z - h.z;
      if (dx > range || dx < -range || dz > range || dz < -range) continue;
      const v = (o.pts / (Math.hypot(dx, dz) + 4)) * rnd(0.8, 1.2);
      if (v > bestV) { bestV = v; best = o; prey = null; }
    }
    if (h.target !== best) h.stuckT = 0;

    else {
      h.chase = null;
      if (best) { h.gx = best.p.x; h.gz = best.p.z; }
      else if (Math.hypot(h.gx - h.x, h.gz - h.z) < 3) { h.gx = rnd(8 - B, B - 8); h.gz = rnd(8 - B, B - 8); }
    }
  }
  function aiSteer(h, dt) {
    h.huntCD -= dt;
    if ((h.thinkT -= dt) <= 0) { aiThink(h); h.thinkT = rnd(0.3, 0.6); }
    let gx = h.gx, gz = h.gz;
    const c = h.chase, t = h.target;
    if (c) {
      if (c.dead || c.protect > 0 || c.r * 1.18 > h.r || (h.chaseT -= dt) <= 0) { h.chase = null; h.huntCD = 5; }

    } else if (t) {

    return [(dx / d) * k, (dz / d) * k];
  }

  function holeFights() {
    for (const a of holes) for (const b of holes) {

      if (Math.hypot(a.x - b.x, a.z - b.z) < a.r - b.r * 0.35) swallowHole(a, b);
    }
  }
  function swallowHole(a, b) {
    const pts = 10 + Math.round(b.r * b.r * 3);

    consumeInPit(b);
    a.tr = Math.min(CFG.maxR, Math.hypot(a.tr, b.r * 0.7));
    a.score += pts;
    if (a === player) { player.pending += pts; toast(`You swallowed ${b.name}! +${pts}`); }

  }

      if (m > best) { best = m; bx = x; bz = z; }
    }

    Object.assign(h, { x: bx, z: bz, gx: bx, gz: bz, px: bx, pz: bz, pr: r, vx: 0, vz: 0, r, tr: r, dead: false, protect: CFG.protect, chase: null, target: null });
  }

  function syncHole(h) {
    const u = holeUniform.value[h.idx], alive = !h.dead;
    h.pit.visible = alive;

    u.set(h.x, h.z, h.r);

  }

  /* ================= CAMERA ================= */
  const focus = { x: 0, z: 0 };
  let camD = 22;
  function updateCamera(dt, snap) {
    const want = (16 + player.r * 5.5) * (camera.aspect < 1 ? 1.45 : 1);
    const kd = snap ? 1 : Math.min(1, dt * 2.5), kf = snap ? 1 : Math.min(1, dt * 8);
    camD += (want - camD) * kd;
    focus.x += (player.x - focus.x) * kf;
    focus.z += (player.z - focus.z) * kf;
    camera.position.set(focus.x, camD * 0.9, focus.z + camD * 0.6);
    camera.lookAt(focus.x, 0, focus.z);

  /* ================= HUD ================= */
  const timerEl = $('timer'), boardEl = $('board'), toastEl = $('toast'), overlay = $('overlay'), panel = $('panel');

  /* ================= INPUT: WASD / arrows + drag joystick ================= */

  /* ================= GAME FLOW / MODES ================= */
  const MODES = {

  const MENU_HTML = () => `<h1>🕳️ Hole City</h1>
    <p>Swallow the city and any hole smaller than you. Hunt <b>✨ golden</b> things worth 5x and chain bites for a combo.</p>
    <p><b>WASD / arrows</b> or <b>drag</b> to move, <b>Space</b> to dash.</p>
    <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button data-mode="${k}">${m.label}<small>${m.desc}</small></button>`).join('')}</div>`;

  function resetGame() {
    resetBodies();
    holes.forEach((h, i) => {
      const [x, z] = SPAWNS[i], off = h.ai && !mode.ai;
      Object.assign(h, { x, z, gx: x, gz: z, px: x, pz: z, pr: CFG.startR, vx: 0, vz: 0, r: CFG.startR, tr: CFG.startR, lastR: CFG.startR,
        score: 0, pending: 0, dead: off, respawnT: off ? Infinity : 0, protect: 1, chase: null, target: null, huntCD: 2, thinkT: rnd(0, 0.4),
        dashT: 0, dashCD: 0, combo: 0, lastEat: -9, eaten: 0 });
    });
    timeLeft = mode.time; hudT = 0;
    updateCamera(0, true);
    updateHUD();
  }
  function showPanel(html) {
    panel.innerHTML = html;
    overlay.classList.remove('hidden');
    panel.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => startGame(b.dataset.mode)));
    const menu = panel.querySelector('[data-menu]');
    if (menu) menu.onclick = () => showPanel(MENU_HTML());
    const res = panel.querySelector('[data-resume]'), quit = panel.querySelector('[data-end]');
    if (res) res.onclick = resumeGame;
    if (quit) quit.onclick = endGame;
    const first = panel.querySelector('button');
    if (first) first.focus();
  }
  function startGame(key = modeKey) {
    modeKey = key; mode = MODES[key];
    resetGame(); state = 'play';
    overlay.classList.add('hidden'); document.body.classList.add('playing');
  }
  function endGame() {
    state = 'over';
    document.body.classList.remove('playing');
    endJoy();
    const list = ranked(), rank = list.indexOf(player) + 1;
    const title = !mode.ai ? `🏙️ You ate ${((100 * player.eaten) / objects.length).toFixed(1)}% of the city`
      : rank === 1 ? '🏆 You win!' : `You placed #${rank}`;
    showPanel(`<h1>${title}</h1><p>${mode.label.slice(mode.label.indexOf(' ') + 1)}: final scores</p>
      <ol class="board">${boardHTML(list)}</ol>
      <div class="row"><button data-mode="${modeKey}">Play again</button><button class="alt" data-menu>Change mode</button></div>`);
  }
  endBtn.onclick = () => { if (state === 'play') endGame(); };
  function pauseGame() {
    if (state !== 'play') return;
    state = 'paused'; endJoy();
    for (const k in keys) keys[k] = false;
    showPanel('<h1>⏸️ Paused</h1><div class="row"><button data-resume>Resume</button><button class="alt" data-end>End round</button></div>');
  }
  function resumeGame() { if (state === 'paused') { overlay.classList.add('hidden'); state = 'play'; } }
  $('pauseBtn').onclick = pauseGame;
  dashBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); if (state === 'play') dash(player); });

  /* ================= MAIN LOOP ================= */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    clock += dt;
    if (state === 'play') {
      timeLeft -= dt;
      for (const h of holes) updateHole(h, dt);
      holeFights();
      if (mode.regrow) respawnObjects(dt);
      if ((hudT -= dt) <= 0) { hudT = 0.2; updateHUD(); }
      if (timeLeft <= 0) { timeLeft = 0; updateHUD(); endGame(); }
    }
    if (state !== 'paused') physicsStep(dt);
    updateCamera(dt);
    holes.forEach(syncHole);
    flushInstances();
    renderer.render(scene, camera);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  window.__holeCity = { objects, holes, awake, physicsStep, resetBodies }; // debug handle
  resetGame();
  showPanel(MENU_HTML());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
